name: Check links

on:
  push:
    branches: [main]
  schedule:
    - cron: '0 9 * * 1' # weekly, Monday 09:00 UTC
  workflow_dispatch:

jobs:
  linkcheck:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version-file: .node-version
          cache: npm

      - run: npm ci
      - run: npm run build

      - name: Check links in HTML
        uses: lycheeverse/lychee-action@v2
        with:
          # Remap Discord invites to the API so dead invites return 404
          # instead of a 200 "invite invalid" page.
          # Accept 403/429: X/Twitter and some sites block bots but the
          # links are fine; a truly dead page still returns 404.
          # These runtime routes have no file in dist/: /play variants are
          # Cloudflare redirects, and /api/feedback accepts Worker POSTs.
          # Their behavior is covered by the deployment guard and Worker tests.
          # Exclude only these exact routes so other missing files still fail.
          args: >-
            --no-progress
            --root-dir ${{ github.workspace }}/dist
            --accept '200..=299,403,429'
            --remap 'https://discord.com/invite/(.*) https://discord.com/api/v10/invites/$1'
            --exclude '^file://.*/dist/(?:veilkeeper/)?play/?(?:[?#].*)?$'
            --exclude '^file://.*/dist/api/feedback$'
            './dist/**/*.html'
          fail: true
