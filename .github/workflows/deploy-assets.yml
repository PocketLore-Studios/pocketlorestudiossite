name: Deploy asset guard

# Builds Astro and checks that dist/ contains only public output and valid links.
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  assets:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version-file: .node-version
          cache: npm

      - run: npm ci
      - run: npm run types
      - run: npm run check
      - run: npm test

      - name: Check the deployment asset set
        run: bash .github/scripts/check-deploy-assets.sh
